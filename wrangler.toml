name = "market-data-github-bridge"
main = "src/worker.js"
compatibility_date = "2026-09-10"

# Public repository defaults. Change these values for another repository.
[vars]
GITHUB_OWNER = "grichtoyang"
GITHUB_REPO = "cloudflare-github-test"
GITHUB_BRANCH = "main"
CACHE_TTL_SECONDS = "300"

# Comma-separated browser origins. Leave unset to disable CORS for browsers.
# ALLOWED_ORIGINS = "https://your-app.example.com"

# For private repositories, configure a read-only GitHub fine-grained token:
#   npx wrangler secret put GITHUB_TOKEN
