name: Daily Market Report

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1-5'

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set report date (Asia/Taipei)
        id: date
        shell: bash
        run: echo "report_date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"

      - name: Collect spot data
        run: python scripts/spot_snapshot.py --date "${{ steps.date.outputs.report_date }}"

      - name: Generate spot report
        run: python scripts/generate_daily_report.py --date "${{ steps.date.outputs.report_date }}"

      - name: Verify spot artifacts
        shell: bash
        run: |
          date="${{ steps.date.outputs.report_date }}"
          test -s "data/spot/${date}.json"
          test -s "data/snapshots/${date}/spot-snapshot.json"
          test -s "reports/${date}.md"
          grep -q '^## 一、現貨' "reports/${date}.md"
          echo "Spot report verification passed."

      - name: Commit spot artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/spot data/snapshots reports
          if git diff --cached --quiet; then
            echo "No spot changes."
          else
            git commit -m "Collect spot data and generate report ${{ steps.date.outputs.report_date }}"
            git push
          fi
