name: Daily Market Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1-5'

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set report date (Asia/Taipei)
        id: date
        shell: bash
        run: echo "report_date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"

      - name: Generate report
        run: python scripts/generate_daily_report.py --date "${{ steps.date.outputs.report_date }}"

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Generate daily market report ${{ steps.date.outputs.report_date }}"
            git push
          fi
