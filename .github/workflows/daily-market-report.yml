name: Daily Market Report

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1-5'

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set report date (Asia/Taipei)
        id: date
        shell: bash
        run: echo "report_date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"

      - name: Generate report
        run: python scripts/generate_daily_report.py --date "${{ steps.date.outputs.report_date }}"

      - name: Verify generated report
        shell: bash
        run: |
          report="reports/${{ steps.date.outputs.report_date }}.md"
          test -s "$report"
          grep -Eq '台指期行情筆數：[1-9][0-9]*' "$report"
          grep -Eq '法人交易筆數：[1-9][0-9]*' "$report"
          echo "Report verification passed."
          grep -E '台指期行情筆數|法人交易筆數|法人 OI 筆數|選擇權辨識筆數' "$report"

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Generate daily market report ${{ steps.date.outputs.report_date }}"
            git push
          fi
