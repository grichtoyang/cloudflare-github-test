name: TAIFEX Python Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily snapshot collector unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run legacy TAIFEX chip analysis
        run: |
          python taifex_chip_analysis.py
