name: TAIFEX Python Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run legacy TAIFEX chip analysis
        run: |
          python taifex_chip_analysis.py

      - name: Run daily snapshot collector smoke test
        env:
          TAIFEX_PROXY_BASE_URL: https://taifex.grichtoyang.workers.dev
        run: |
          python scripts/daily_snapshot.py --date 2026-09-10
