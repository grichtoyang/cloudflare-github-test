name: Daily Pre-Market Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/daily-snapshot.yml"
      - "scripts/daily_snapshot.py"
      - "scripts/resolve_t0.py"
      - "scripts/twse_snapshot.py"
      - "scripts/build_premarket_manifest.py"
      - "scripts/build_premarket_ai_inputs.py"
      - "scripts/validate_premarket_ai_inputs.py"
  schedule:
    - cron: "0 0 * * 1-5"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      TAIFEX_PROXY_BASE_URL: https://taifex.grichtoyang.workers.dev
      TWSE_PROXY_BASE_URL: https://twse-proxy.grichtoyang.workers.dev
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify production proxy URLs
        run: |
          set -euo pipefail
          test "$TAIFEX_PROXY_BASE_URL" = "https://taifex.grichtoyang.workers.dev"
          test "$TWSE_PROXY_BASE_URL" = "https://twse-proxy.grichtoyang.workers.dev"

      - name: Resolve Analysis Date
        id: analysis_date
        shell: bash
        run: |
          set -euo pipefail
          analysis_date="$(TZ=Asia/Taipei date +%F)"
          echo "analysis_date=$analysis_date" >> "$GITHUB_OUTPUT"
          echo "Analysis Date: $analysis_date"

      - name: Resolve T0
        id: t0
        shell: bash
        run: |
          set +e
          output="$(python scripts/resolve_t0.py --analysis-date "${{ steps.analysis_date.outputs.analysis_date }}")"
          status=$?
          echo "$output"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            t0="$(printf '%s\n' "$output" | tail -n 1)"
            echo "t0=$t0" >> "$GITHUB_OUTPUT"
          else
            echo "t0=" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Build TAIFEX snapshot
        id: taifex
        if: steps.t0.outputs.status == '0'
        shell: bash
        run: |
          set +e
          python scripts/daily_snapshot.py --date "${{ steps.t0.outputs.t0 }}" --analysis-date "${{ steps.analysis_date.outputs.analysis_date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          set -e
          exit 0

      - name: Build TWSE snapshot
        id: twse
        if: steps.t0.outputs.status == '0'
        shell: bash
        run: |
          set +e
          python scripts/twse_snapshot.py --date "${{ steps.t0.outputs.t0 }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          set -e
          exit 0

      - name: Build canonical pre-market manifest
        id: canonical
        if: steps.t0.outputs.status == '0' && (steps.taifex.outputs.status == '0' || steps.taifex.outputs.status == '3') && (steps.twse.outputs.status == '0' || steps.twse.outputs.status == '3')
        shell: bash
        run: |
          set +e
          python scripts/build_premarket_manifest.py --date "${{ steps.t0.outputs.t0 }}" --analysis-date "${{ steps.analysis_date.outputs.analysis_date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          set -e
          exit 0

      - name: Build AI-input package
        id: aiinput
        if: steps.t0.outputs.status == '0' && (steps.canonical.outputs.status == '0' || steps.canonical.outputs.status == '3')
        shell: bash
        run: |
          set +e
          python scripts/build_premarket_ai_inputs.py --analysis-date "${{ steps.analysis_date.outputs.analysis_date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          set -e
          exit 0

      - name: Validate AI-input integrity
        id: validate_aiinput
        if: steps.t0.outputs.status == '0' && (steps.aiinput.outputs.status == '0' || steps.aiinput.outputs.status == '3')
        shell: bash
        run: |
          set +e
          python scripts/validate_premarket_ai_inputs.py --analysis-date "${{ steps.analysis_date.outputs.analysis_date }}" --t0 "${{ steps.t0.outputs.t0 }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          set -e
          exit 0

      - name: READY_FOR_ANALYSIS gate
        id: ready_gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          t0_status="${{ steps.t0.outputs.status }}"
          taifex_status="${{ steps.taifex.outputs.status }}"
          twse_status="${{ steps.twse.outputs.status }}"
          canonical_status="${{ steps.canonical.outputs.status }}"
          aiinput_status="${{ steps.aiinput.outputs.status }}"
          validator_status="${{ steps.validate_aiinput.outputs.status }}"
          validator_outcome="${{ steps.validate_aiinput.outcome }}"

          echo "Analysis Date: ${{ steps.analysis_date.outputs.analysis_date }}"
          echo "T0: ${{ steps.t0.outputs.t0 }}"
          echo "T0 status: $t0_status"
          echo "TAIFEX status: $taifex_status"
          echo "TWSE status: $twse_status"
          echo "Canonical status: $canonical_status"
          echo "AI-input status: $aiinput_status"
          echo "Validator outcome: $validator_outcome"
          echo "Validator status: $validator_status"

          test "$t0_status" = "0"
          test "$taifex_status" = "0" -o "$taifex_status" = "3"
          test "$twse_status" = "0" -o "$twse_status" = "3"
          test "$canonical_status" = "0" -o "$canonical_status" = "3"
          test "$aiinput_status" = "0" -o "$aiinput_status" = "3"
          test "$validator_outcome" = "success"
          test "$validator_status" = "0"
          echo "READY_FOR_ANALYSIS=true"

      - name: Commit/Push validated artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/taifex data/twse data/snapshots data/manifests data/premarket
          if git diff --cached --quiet; then
            echo "No validated artifact changes to commit."
            exit 0
          fi
          git commit -m "Update daily pre-market data ${{ steps.analysis_date.outputs.analysis_date }}"
          git push origin main
