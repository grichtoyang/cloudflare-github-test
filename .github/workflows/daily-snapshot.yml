name: Daily Pre-Market Snapshot

on:
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Taipei = 00:00 UTC.
    - cron: "0 0 * * 1-5"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daily TAIFEX snapshot
        id: snapshot
        env:
          TAIFEX_PROXY_BASE_URL: https://taifex.grichtoyang.workers.dev
        run: |
          set +e
          python scripts/daily_snapshot.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit snapshot and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/taifex data/snapshots data/manifests
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update daily TAIFEX snapshot $(date -u +%F)"
            git push
          fi

      - name: Enforce READY_FOR_ANALYSIS gate
        if: steps.snapshot.outputs.status != '0'
        run: |
          echo "Daily snapshot validation failed; READY_FOR_ANALYSIS=false."
          exit 1
