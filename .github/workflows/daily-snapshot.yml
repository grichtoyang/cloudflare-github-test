name: Daily Pre-Market Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # 08:00 Asia/Taipei = 00:00 UTC.
    - cron: "0 0 * * 1-5"

permissions:
  contents: write

jobs:
  snapshot:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[daily-snapshot-test]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Analysis Date
        id: analysis
        run: |
          set -e
          ANALYSIS_DATE=$(TZ=Asia/Taipei date +%F)
          echo "Analysis Date=$ANALYSIS_DATE"
          echo "date=$ANALYSIS_DATE" >> "$GITHUB_OUTPUT"

      - name: Resolve T0 trading date
        id: t0
        run: |
          set -e
          T0_DATE=$(python scripts/resolve_t0.py)
          echo "T0_DATE=$T0_DATE"
          echo "date=$T0_DATE" >> "$GITHUB_OUTPUT"

      - name: Build daily TAIFEX snapshot
        id: taifex
        env:
          TAIFEX_PROXY_BASE_URL: https://taifex.grichtoyang.workers.dev
        run: |
          set +e
          python scripts/daily_snapshot.py \
            --date "${{ steps.t0.outputs.date }}" \
            --analysis-date "${{ steps.analysis.outputs.date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build daily TWSE snapshot
        id: twse
        env:
          TWSE_PROXY_BASE_URL: https://taiex-proxy.grichtoyang.workers.dev
        run: |
          set +e
          python scripts/twse_snapshot.py --date "${{ steps.t0.outputs.date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build canonical pre-market manifest
        id: unified
        run: |
          set +e
          python scripts/build_premarket_manifest.py \
            --date "${{ steps.t0.outputs.date }}" \
            --analysis-date "${{ steps.analysis.outputs.date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit snapshots and manifests
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git status --short

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git commit -m "Update daily pre-market snapshot $(date -u +%F)"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed; aborting rebase."
              git rebase --abort || true
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Snapshot commit pushed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push rejected; retrying after refreshing origin/main."
              sleep 2
            fi
          done

          echo "Failed to push snapshot commit after 3 attempts."
          exit 1

      - name: Enforce READY_FOR_ANALYSIS gate
        if: always() && (steps.t0.outcome != 'success' || steps.taifex.outputs.status != '0' || steps.twse.outputs.status != '0' || steps.unified.outputs.status != '0')
        run: |
          echo "Daily pre-market package validation failed; READY_FOR_ANALYSIS=false."
          echo "Analysis Date=${{ steps.analysis.outputs.date }}"
          echo "T0=${{ steps.t0.outputs.date }}"
          echo "TAIFEX status=${{ steps.taifex.outputs.status }}"
          echo "TWSE status=${{ steps.twse.outputs.status }}"
          echo "Unified manifest status=${{ steps.unified.outputs.status }}"
          exit 1
