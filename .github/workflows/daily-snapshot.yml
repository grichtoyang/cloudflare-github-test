name: Daily Pre-Market Snapshot

on:
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Taipei = 00:00 UTC.
    - cron: "0 0 * * 1-5"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daily TAIFEX snapshot
        id: taifex
        env:
          TAIFEX_PROXY_BASE_URL: https://taifex.grichtoyang.workers.dev
        run: |
          set +e
          python scripts/daily_snapshot.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build daily TWSE snapshot
        id: twse
        env:
          TWSE_PROXY_BASE_URL: https://taiex-proxy.grichtoyang.workers.dev
        run: |
          set +e
          python scripts/twse_snapshot.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build unified pre-market manifest
        id: unified
        run: |
          set +e
          python scripts/build_premarket_manifest.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit snapshots and manifests
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/taifex data/twse data/snapshots data/manifests
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update daily pre-market snapshot $(date -u +%F)"
            git push
          fi

      - name: Enforce READY_FOR_ANALYSIS gate
        if: steps.taifex.outputs.status != '0' || steps.twse.outputs.status != '0' || steps.unified.outputs.status != '0'
        run: |
          echo "Daily pre-market package validation failed; READY_FOR_ANALYSIS=false."
          echo "TAIFEX status=${{ steps.taifex.outputs.status }}"
          echo "TWSE status=${{ steps.twse.outputs.status }}"
          echo "Unified manifest status=${{ steps.unified.outputs.status }}"
          exit 1
