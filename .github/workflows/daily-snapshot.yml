name: Daily Pre-Market Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-snapshot.yml'
  schedule:
    # 08:00 Asia/Taipei = 00:00 UTC.
    - cron: "0 0 * * 1-5"

permissions:
  contents: write

env:
  TAIFEX_PROXY_BASE_URL: https://taifex.grichtoyang.workers.dev
  TWSE_PROXY_BASE_URL: https://twse-proxy.grichtoyang.workers.dev

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify production proxy URLs
        run: |
          set -eu
          test "$TAIFEX_PROXY_BASE_URL" = "https://taifex.grichtoyang.workers.dev"
          test "$TWSE_PROXY_BASE_URL" = "https://twse-proxy.grichtoyang.workers.dev"
          grep -F 'DEFAULT_BASE = "https://taifex.grichtoyang.workers.dev"' scripts/daily_snapshot.py >/dev/null
          grep -F 'DEFAULT_BASE = "https://twse-proxy.grichtoyang.workers.dev"' scripts/twse_snapshot.py >/dev/null
          if grep -F 'DEFAULT_BASE = "https://taiex-proxy.grichtoyang.workers.dev"' scripts/twse_snapshot.py >/dev/null; then
            echo "ERROR: legacy TWSE proxy URL is configured as the active collector DEFAULT_BASE."
            exit 1
          fi
          echo "Production proxy URL regression check passed."

      - name: Resolve Analysis Date
        id: analysis
        run: |
          set -e
          ANALYSIS_DATE=$(TZ=Asia/Taipei date +%F)
          echo "Analysis Date=$ANALYSIS_DATE"
          echo "date=$ANALYSIS_DATE" >> "$GITHUB_OUTPUT"

      - name: Resolve T0 trading date
        id: t0
        run: |
          set -e
          T0_DATE=$(python scripts/resolve_t0.py)
          echo "T0_DATE=$T0_DATE"
          echo "date=$T0_DATE" >> "$GITHUB_OUTPUT"

      - name: Build daily TAIFEX snapshot
        id: taifex
        run: |
          set +e
          python scripts/daily_snapshot.py \
            --date "${{ steps.t0.outputs.date }}" \
            --analysis-date "${{ steps.analysis.outputs.date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build daily TWSE snapshot
        id: twse
        run: |
          set +e
          python scripts/twse_snapshot.py --date "${{ steps.t0.outputs.date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build canonical pre-market manifest
        id: unified
        run: |
          set +e
          python scripts/build_premarket_manifest.py \
            --date "${{ steps.t0.outputs.date }}" \
            --analysis-date "${{ steps.analysis.outputs.date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build ChatGPT-readable AI data package
        id: aiinput
        if: steps.unified.outputs.status == '0' || steps.unified.outputs.status == '3'
        run: |
          set +e
          python scripts/build_premarket_ai_inputs.py \
            --analysis-date "${{ steps.analysis.outputs.date }}" \
            --t0-date "${{ steps.t0.outputs.date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate AI-input integrity
        id: aiinput_validate
        if: steps.unified.outputs.status == '0' || steps.unified.outputs.status == '3'
        run: |
          set +e
          python scripts/validate_premarket_ai_inputs.py \
            --analysis-date "${{ steps.analysis.outputs.date }}" \
            --t0-date "${{ steps.t0.outputs.date }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit snapshots, manifests, and ChatGPT data package
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git status --short

          if git diff --cached --quiet; then
            echo "No snapshot/manifest/AI-input changes to commit."
            exit 0
          fi

          git commit -m "Update daily pre-market data $(date -u +%F)"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed; aborting rebase."
              git rebase --abort || true
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Daily pre-market data commit pushed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push rejected; retrying after refreshing origin/main."
              sleep 2
            fi
          done

          echo "Failed to push daily pre-market data commit after 3 attempts."
          exit 1

      - name: Enforce READY_FOR_ANALYSIS data gate
        if: always() && (steps.t0.outcome != 'success' || (steps.unified.outputs.status != '0' && steps.unified.outputs.status != '3') || (steps.aiinput.outputs.status != '0' && steps.aiinput.outputs.status != '3') || steps.aiinput_validate.outcome != 'success' || steps.aiinput_validate.outputs.status != '0')
        run: |
          echo "Daily pre-market data package validation failed; READY_FOR_ANALYSIS=false."
          echo "Analysis Date=${{ steps.analysis.outputs.date }}"
          echo "T0=${{ steps.t0.outputs.date }}"
          echo "TAIFEX status=${{ steps.taifex.outputs.status }}"
          echo "TWSE status=${{ steps.twse.outputs.status }}"
          echo "Unified manifest status=${{ steps.unified.outputs.status }}"
          echo "ChatGPT AI-input package status=${{ steps.aiinput.outputs.status }}"
          echo "AI-input integrity status=${{ steps.aiinput_validate.outputs.status }}"
          exit 1
