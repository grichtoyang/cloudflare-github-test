name: Daily Premarket Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-snapshot.yml'
      - 'scripts/**'
      - 'tests/**'
  schedule:
    - cron: '0 0 * * 1-5'

permissions:
  contents: write

env:
  TZ: Asia/Taipei
  TAIFEX_PROXY_BASE_URL: https://taifex.grichtoyang.workers.dev
  TWSE_PROXY_BASE_URL: https://twse-proxy.grichtoyang.workers.dev

jobs:
  daily-snapshot:
    name: Daily Premarket Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Taiwan session and dates
        id: dates
        shell: bash
        run: |
          set -euo pipefail
          runtime_date="$(TZ=Asia/Taipei date '+%Y-%m-%d')"
          runtime_hour="$(TZ=Asia/Taipei date '+%H')"
          runtime_minute="$(TZ=Asia/Taipei date '+%M')"
          runtime_minutes=$((10#$runtime_hour * 60 + 10#$runtime_minute))
          allowed=false
          if (( runtime_minutes >= 300 && runtime_minutes < 1020 )); then allowed=true; fi
          echo "runtime_date=${runtime_date}" >> "$GITHUB_OUTPUT"
          echo "allowed=${allowed}" >> "$GITHUB_OUTPUT"
          if [[ "${allowed}" != true ]]; then exit 0; fi
          t0_date="$(python scripts/resolve_t0.py | tr -d '[:space:]')"
          [[ "${t0_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "t0=${t0_date}" >> "$GITHUB_OUTPUT"
      - name: Build TAIFEX snapshot
        id: taifex
        if: steps.dates.outputs.allowed == 'true'
        run: |
          set +e
          python scripts/daily_snapshot.py --date "${{ steps.dates.outputs.t0 }}" --analysis-date "${{ steps.dates.outputs.runtime_date }}" --base-url "${TAIFEX_PROXY_BASE_URL}"
          status=$?
          set -e
          if [[ "$status" != 0 && "$status" != 3 ]]; then exit "$status"; fi
      - name: Build TWSE snapshot
        id: twse
        if: steps.dates.outputs.allowed == 'true'
        run: |
          set +e
          python scripts/twse_snapshot.py --date '${{ steps.dates.outputs.t0 }}' --base-url "${TWSE_PROXY_BASE_URL}?date=${{ steps.dates.outputs.t0 }}"
          status=$?
          set -e
          if [[ "$status" != 0 && "$status" != 3 ]]; then exit "$status"; fi
      - name: Collect raw TWSE and TPEX spot JSON
        id: spot_raw
        if: steps.dates.outputs.allowed == 'true'
        run: |
          python scripts/diagnose_spot_raw.py --date '${{ steps.dates.outputs.t0 }}'
      - name: Upload raw spot JSON diagnostic
        if: always() && steps.dates.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spot-raw-json-${{ steps.dates.outputs.t0 }}
          path: data/raw/
          if-no-files-found: error
          retention-days: 14
      - name: Build SPOT snapshot
        id: spot
        if: steps.dates.outputs.allowed == 'true'
        run: |
          set +e
          python scripts/spot_snapshot.py --date '${{ steps.dates.outputs.t0 }}'
          status=$?
          set -e
          if [[ "$status" != 0 && "$status" != 3 ]]; then exit "$status"; fi
      - name: Generate strict SPOT report
        id: spot_report
        if: steps.dates.outputs.allowed == 'true'
        run: python scripts/generate_daily_report.py --date '${{ steps.dates.outputs.t0 }}'
      - name: Build premarket manifest
        id: manifest
        if: steps.dates.outputs.allowed == 'true'
        run: |
          set +e
          python scripts/build_premarket_manifest.py --date '${{ steps.dates.outputs.t0 }}' --analysis-date '${{ steps.dates.outputs.runtime_date }}'
          status=$?
          set -e
          if [[ "$status" != 0 && "$status" != 3 ]]; then exit "$status"; fi
      - name: Build premarket AI inputs
        id: ai_inputs
        if: steps.dates.outputs.allowed == 'true'
        run: |
          set +e
          python scripts/build_premarket_ai_inputs.py --analysis-date '${{ steps.dates.outputs.runtime_date }}' --t0-date '${{ steps.dates.outputs.t0 }}'
          status=$?
          set -e
          if [[ "$status" != 0 && "$status" != 3 ]]; then exit "$status"; fi
      - name: Validate AI inputs
        id: validator
        if: steps.dates.outputs.allowed == 'true'
        run: |
          set +e
          python scripts/validate_premarket_ai_inputs.py --analysis-date '${{ steps.dates.outputs.runtime_date }}' --t0-date '${{ steps.dates.outputs.t0 }}'
          status=$?
          set -e
          if [[ "$status" != 0 && "$status" != 3 ]]; then exit "$status"; fi
      - name: READY_FOR_ANALYSIS gate
        id: ready_gate
        if: always()
        env:
          ALLOWED: ${{ steps.dates.outputs.allowed }}
          TAIFEX: ${{ steps.taifex.outcome }}
          TWSE: ${{ steps.twse.outcome }}
          SPOT: ${{ steps.spot.outcome }}
          SPOT_REPORT: ${{ steps.spot_report.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
          AI_INPUTS: ${{ steps.ai_inputs.outcome }}
          VALIDATOR: ${{ steps.validator.outcome }}
        run: |
          set -euo pipefail
          if [[ "${ALLOWED}" != true ]]; then echo 'READY_FOR_ANALYSIS=false'; exit 0; fi
          for status in "${TAIFEX}" "${TWSE}" "${SPOT}" "${SPOT_REPORT}" "${MANIFEST}" "${AI_INPUTS}" "${VALIDATOR}"; do [[ "${status}" == success ]]; done
          python - <<'PY'
          import json
          from pathlib import Path
          p = next(Path('data/spot').glob('*.json'))
          payload = json.loads(p.read_text(encoding='utf-8'))
          unavailable = payload.get('unavailable_fields', [])
          if unavailable:
              raise SystemExit('SPOT incomplete: ' + ', '.join(unavailable))
          if payload.get('missing_required'):
              raise SystemExit('SPOT missing required fields: ' + ', '.join(payload['missing_required']))
          print('SPOT completeness check passed')
          PY
          echo 'READY_FOR_ANALYSIS=true'
      - name: Commit and push generated data and reports
        if: steps.ready_gate.outcome == 'success' && steps.dates.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ reports/
          if git diff --cached --quiet; then echo 'No artifact changes to commit.'; exit 0; fi
          git commit -m "Update daily premarket snapshot ${{ steps.dates.outputs.runtime_date }}"
          git push
