name: Daily Premarket Snapshot

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-snapshot.yml"
      - "scripts/**"
      - "tests/**"

  schedule:
    # GitHub Actions 使用 UTC
    # UTC 00:00 = 台灣時間 08:00
    - cron: "0 0 * * 1-5"

permissions:
  contents: write

env:
  TZ: Asia/Taipei
  TAIFEX_PROXY_BASE_URL: https://taifex.grichtoyang.workers.dev
  TWSE_PROXY_BASE_URL: https://twse-proxy.grichtoyang.workers.dev

jobs:
  daily-snapshot:
    name: Daily Premarket Snapshot
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Set up Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. Verify proxy configuration
      # ============================================================
      - name: Verify proxy configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "${TAIFEX_PROXY_BASE_URL}"
          test -n "${TWSE_PROXY_BASE_URL}"

          echo "TAIFEX proxy: ${TAIFEX_PROXY_BASE_URL}"
          echo "TWSE proxy: ${TWSE_PROXY_BASE_URL}"

      # ============================================================
      # 4. Resolve Taiwan runtime session
      #
      # Allowed:
      #   05:00 inclusive
      #   15:00 exclusive
      #
      # Not allowed:
      #   15:00–隔日 05:00
      # ============================================================
      - name: Resolve Taiwan runtime session
        id: session
        shell: bash
        run: |
          set -euo pipefail

          runtime_date="$(TZ=Asia/Taipei date '+%Y-%m-%d')"
          runtime_time="$(TZ=Asia/Taipei date '+%H:%M:%S')"
          runtime_hour="$(TZ=Asia/Taipei date '+%H')"
          runtime_minute="$(TZ=Asia/Taipei date '+%M')"

          runtime_minutes=$((10#${runtime_hour} * 60 + 10#${runtime_minute}))

          if [ "${runtime_minutes}" -ge 300 ] \
            && [ "${runtime_minutes}" -lt 900 ]; then
            session_allowed="true"
            session_state="PREMARKET_ALLOWED"
          else
            session_allowed="false"
            session_state="OUTSIDE_PREMARKET_WINDOW"
          fi

          echo "runtime_date=${runtime_date}" >> "${GITHUB_OUTPUT}"
          echo "runtime_time=${runtime_time}" >> "${GITHUB_OUTPUT}"
          echo "runtime_minutes=${runtime_minutes}" >> "${GITHUB_OUTPUT}"
          echo "session_allowed=${session_allowed}" >> "${GITHUB_OUTPUT}"
          echo "session_state=${session_state}" >> "${GITHUB_OUTPUT}"

          echo "Taiwan runtime date: ${runtime_date}"
          echo "Taiwan runtime time: ${runtime_time}"
          echo "Taiwan runtime minutes: ${runtime_minutes}"
          echo "Session state: ${session_state}"
          echo "Session allowed: ${session_allowed}"

      # ============================================================
      # 5. Handle execution outside premarket window
      # ============================================================
      - name: Handle outside premarket window
        if: steps.session.outputs.session_allowed != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "OUTSIDE_PREMARKET_WINDOW"
          echo "No Taiwan premarket snapshot will be generated."
          echo "No TAIFEX/TWSE collection will be executed."
          echo "No formal report will be published."
          echo "No commit will be created."
          echo "============================================================"

          {
            echo "## READY_FOR_ANALYSIS"
            echo ""
            echo "**READY_FOR_ANALYSIS=false**"
            echo ""
            echo "SESSION_STATE=${{ steps.session.outputs.session_state }}"
            echo "RUNTIME_DATE=${{ steps.session.outputs.runtime_date }}"
            echo "RUNTIME_TIME=${{ steps.session.outputs.runtime_time }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ============================================================
      # 6. Resolve Analysis Date
      # ============================================================
      - name: Resolve analysis date
        id: analysis_date
        if: steps.session.outputs.session_allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          analysis_date="${{ steps.session.outputs.runtime_date }}"

          if ! [[ "${analysis_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "ERROR: Invalid Analysis Date: ${analysis_date}"
            exit 1
          fi

          echo "analysis_date=${analysis_date}" >> "${GITHUB_OUTPUT}"
          echo "Analysis Date: ${analysis_date}"

      # ============================================================
      # 7. Resolve T0 trading date
      #
      # IMPORTANT:
      # resolve_t0.py currently:
      #   - does not accept --analysis-date
      #   - prints the resolved T0 date to stdout
      #
      # Therefore:
      #   t0_date="$(python scripts/resolve_t0.py)"
      #
      # Then explicitly write it to GITHUB_OUTPUT.
      # ============================================================
      - name: Resolve T0 trading date
        id: t0
        if: steps.session.outputs.session_allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          analysis_date="${{ steps.analysis_date.outputs.analysis_date }}"

          echo "Resolving T0 from Analysis Date: ${analysis_date}"

          t0_date="$(
            python scripts/resolve_t0.py
          )"

          t0_date="$(printf '%s' "${t0_date}" | tr -d '[:space:]')"

          if [ -z "${t0_date}" ]; then
            echo "ERROR: T0 date is empty."
            exit 1
          fi

          if ! [[ "${t0_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "ERROR: Invalid T0 date: ${t0_date}"
            exit 1
          fi

          echo "Resolved T0 date: ${t0_date}"

          # 本次修正的核心
          echo "t0=${t0_date}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Date Resolution"
            echo ""
            echo "Analysis Date: ${analysis_date}"
            echo "T0 Date: ${t0_date}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ============================================================
      # 8. Build TAIFEX snapshot
      # ============================================================
      - name: Build TAIFEX snapshot
        id: taifex
        if: steps.session.outputs.session_allowed == 'true'
        shell: bash
        env:
          ANALYSIS_DATE: ${{ steps.analysis_date.outputs.analysis_date }}
          T0_DATE: ${{ steps.t0.outputs.t0 }}
        run: |
          set -euo pipefail

          if [ -z "${T0_DATE}" ]; then
            echo "ERROR: T0_DATE is empty."
            exit 1
          fi

          if ! [[ "${T0_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "ERROR: Invalid T0_DATE: ${T0_DATE}"
            exit 1
          fi

          if [ -z "${ANALYSIS_DATE}" ]; then
            echo "ERROR: ANALYSIS_DATE is empty."
            exit 1
          fi

          echo "Analysis Date: ${ANALYSIS_DATE}"
          echo "T0 Date: ${T0_DATE}"

          python scripts/daily_snapshot.py \
            --date "${T0_DATE}" \
            --analysis-date "${ANALYSIS_DATE}" \
            --base-url "${TAIFEX_PROXY_BASE_URL}"

      # ============================================================
      # 9. Verify TWSE Proxy T0 date propagation
      # ============================================================
      - name: Verify TWSE proxy T0 date propagation
        id: twse_probe
        if: steps.session.outputs.session_allowed == 'true'
        shell: bash
        env:
          T0_DATE: ${{ steps.t0.outputs.t0 }}
        run: |
          set -euo pipefail

          if [ -z "${T0_DATE}" ]; then
            echo "ERROR: T0_DATE is empty."
            exit 1
          fi

          twse_query_date="${T0_DATE//-/}"
          twse_url="${TWSE_PROXY_BASE_URL}?date=${twse_query_date}"

          echo "TWSE T0 date: ${T0_DATE}"
          echo "TWSE query date: ${twse_query_date}"
          echo "TWSE request URL: ${twse_url}"

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            "${twse_url}" \
            -o /tmp/twse.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_date = os.environ["T0_DATE"]

          payload = json.loads(
              Path("/tmp/twse.json").read_text(encoding="utf-8")
          )

          assert payload.get("ok") is True, (
              f"TWSE proxy ok != true: {payload}"
          )

          actual_date = payload.get("date")

          assert actual_date == expected_date, (
              f"TWSE proxy date mismatch: "
              f"expected {expected_date}, got {actual_date}"
          )

          data = payload.get("data") or {}

          for key in (
              "taiex",
              "market_statistics",
              "advance_decline",
          ):
              assert data.get(key) is not None, (
                  f"TWSE proxy data.{key} is null"
              )

          print("TWSE T0 proxy smoke test: PASS")
          print(f"TWSE proxy date: {actual_date}")
          print(
              "TWSE core data: "
              "taiex/market_statistics/advance_decline = non-null"
          )
          PY

      # ============================================================
      # 10. Build TWSE snapshot
      # ============================================================
      - name: Build TWSE snapshot
        id: twse
        if: steps.session.outputs.session_allowed == 'true'
        shell: bash
        env:
          T0_DATE: ${{ steps.t0.outputs.t0 }}
        run: |
          set -euo pipefail

          if [ -z "${T0_DATE}" ]; then
            echo "ERROR: T0_DATE is empty."
            exit 1
          fi

          twse_query_date="${T0_DATE//-/}"
          twse_url="${TWSE_PROXY_BASE_URL}?date=${twse_query_date}"

          echo "TWSE T0 date: ${T0_DATE}"
          echo "TWSE query date: ${twse_query_date}"
          echo "TWSE request URL: ${twse_url}"

          python scripts/twse_snapshot.py \
            --date "${T0_DATE}" \
            --base-url "${twse_url}"

      # ============================================================
      # 11. Build premarket manifest
      # ============================================================
      - name: Build premarket manifest
        id: manifest
        if: steps.session.outputs.session_allowed == 'true'
        shell: bash
        env:
          ANALYSIS_DATE: ${{ steps.analysis_date.outputs.analysis_date }}
          T0_DATE: ${{ steps.t0.outputs.t0 }}
        run: |
          set -euo pipefail

          python scripts/build_premarket_manifest.py \
            --analysis-date "${ANALYSIS_DATE}" \
            --t0 "${T0_DATE}"

      # ============================================================
      # 12. Build premarket AI inputs
      # ============================================================
      - name: Build premarket AI inputs
        id: ai_inputs
        if: steps.session.outputs.session_allowed == 'true'
        shell: bash
        env:
          ANALYSIS_DATE: ${{ steps.analysis_date.outputs.analysis_date }}
          T0_DATE: ${{ steps.t0.outputs.t0 }}
        run: |
          set -euo pipefail

          python scripts/build_premarket_ai_inputs.py \
            --analysis-date "${ANALYSIS_DATE}" \
            --t0 "${T0_DATE}"

      # ============================================================
      # 13. Validate AI inputs
      # ============================================================
      - name: Validate AI inputs
        id: validator
        if: steps.session.outputs.session_allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python scripts/validate_premarket_ai_inputs.py

      # ============================================================
      # 14. READY_FOR_ANALYSIS gate
      # ============================================================
      - name: READY_FOR_ANALYSIS gate
        id: ready_gate
        if: always()
        shell: bash
        env:
          SESSION_ALLOWED: ${{ steps.session.outputs.session_allowed }}
          SESSION_STATE: ${{ steps.session.outputs.session_state }}
          T0_STATUS: ${{ steps.t0.outcome }}
          TAIFEX_STATUS: ${{ steps.taifex.outcome }}
          TWSE_PROBE_STATUS: ${{ steps.twse_probe.outcome }}
          TWSE_STATUS: ${{ steps.twse.outcome }}
          MANIFEST_STATUS: ${{ steps.manifest.outcome }}
          AI_INPUT_STATUS: ${{ steps.ai_inputs.outcome }}
          VALIDATOR_STATUS: ${{ steps.validator.outcome }}
        run: |
          set -euo pipefail

          if [ "${SESSION_ALLOWED}" != "true" ]; then
            echo "READY_FOR_ANALYSIS=false"
            echo "SESSION_STATE=${SESSION_STATE}"

            {
              echo "## READY_FOR_ANALYSIS"
              echo ""
              echo "**READY_FOR_ANALYSIS=false**"
              echo ""
              echo "Reason: ${SESSION_STATE}"
            } >> "${GITHUB_STEP_SUMMARY}"

            exit 0
          fi

          echo "T0 outcome: ${T0_STATUS}"
          echo "TAIFEX outcome: ${TAIFEX_STATUS}"
          echo "TWSE probe outcome: ${TWSE_PROBE_STATUS}"
          echo "TWSE outcome: ${TWSE_STATUS}"
          echo "Manifest outcome: ${MANIFEST_STATUS}"
          echo "AI input outcome: ${AI_INPUT_STATUS}"
          echo "Validator outcome: ${VALIDATOR_STATUS}"

          test "${T0_STATUS}" = "success"
          test "${TAIFEX_STATUS}" = "success"
          test "${TWSE_PROBE_STATUS}" = "success"
          test "${TWSE_STATUS}" = "success"
          test "${MANIFEST_STATUS}" = "success"
          test "${AI_INPUT_STATUS}" = "success"
          test "${VALIDATOR_STATUS}" = "success"

          echo "READY_FOR_ANALYSIS=true"

          {
            echo "## READY_FOR_ANALYSIS"
            echo ""
            echo "**READY_FOR_ANALYSIS=true**"
            echo ""
            echo "All required data and validation stages passed."
          } >> "${GITHUB_STEP_SUMMARY}"

      # ============================================================
      # 15. Commit and push generated data
      # ============================================================
      - name: Commit and push generated data
        if: >
          steps.session.outputs.session_allowed == 'true' &&
          steps.ready_gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi

          git commit \
            -m "Update daily premarket snapshot ${{ steps.analysis_date.outputs.analysis_date }}"

          git push
